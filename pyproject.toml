[project]
name = "xhs-agent"
version = "0.1.0"
description = "小红书多 Agent 内容生产系统：模型选题、技能与人工审核"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "cryptography>=44; sys_platform != 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
xhs = "xhs_agent.cli:main"
