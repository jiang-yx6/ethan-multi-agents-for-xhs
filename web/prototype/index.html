<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>创作间 · 小红书内容工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="sidebar">
    <a href="#workspace" class="brand" aria-label="创作间首页"><span class="brand-mark">作</span><span>创作间<small>CONTENT STUDIO</small></span></a>
    <p class="sidebar-label">你的内容，有自己的节奏</p>
    <nav aria-label="主导航">
      <button data-page="workspace" class="nav-item active"><span data-icon="workspace"></span>创作工作台</button>
      <button data-page="archive" class="nav-item"><span data-icon="archive"></span>内容归档</button>
      <div class="nav-divider">工作区设置</div>
      <button data-page="profile" class="nav-item"><span data-icon="profile"></span>创作画像</button>
      <button data-page="accounts" class="nav-item"><span data-icon="accounts"></span>发布账号</button>
      <button data-page="settings" class="nav-item"><span data-icon="settings"></span>技能与模型</button>
    </nav>
    <div class="sidebar-note"><span class="small-star">✳</span><p>先写你想表达的，<br>再找到合适的读者。</p><span>需求优先 · 热点可选</span></div>
    <div class="sidebar-bottom"><span class="avatar">林</span><div>我的创作空间<small>本地单人工作区</small></div><span class="live-dot"></span></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div><span class="breadcrumb">工作空间</span><span class="slash">/</span><span id="page-label">创作工作台</span></div><div class="topbar-actions"><span class="prototype-label">交互原型</span><button class="icon-button" id="reset-demo" title="重置演示数据" aria-label="重置演示数据"><span data-icon="reset"></span></button></div></header>
    <div class="demo-banner"><span class="banner-dot"></span>当前使用演示数据。操作保存在此浏览器中，不会调用模型、登录账号或向平台发布。</div>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
